name: Deploy Backend to cPanel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy Laravel
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, mysqli, pdo_pgsql, pgsql, bcmath, curl, zip, tokenizer, fileinfo
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: |
          composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction --no-progress

      - name: Prepare Deploy Package
        run: |
          mkdir -p deploy-staging

          # Copy everything except excluded items
          rsync -a --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='.env.example' \
            --exclude='tests' \
            --exclude='node_modules' \
            --exclude='.dockerignore' \
            --exclude='Dockerfile' \
            --exclude='docker' \
            --exclude='render.yaml' \
            --exclude='phpunit.xml' \
            --exclude='README.md' \
            --exclude='deploy-staging' \
            --exclude='storage/logs/*.log' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/framework/cache/data/*' \
            ./ deploy-staging/

          # Ensure storage directories exist with proper structure
          mkdir -p deploy-staging/storage/logs
          mkdir -p deploy-staging/storage/framework/sessions
          mkdir -p deploy-staging/storage/framework/views
          mkdir -p deploy-staging/storage/framework/cache/data
          touch deploy-staging/storage/logs/.gitkeep
          touch deploy-staging/storage/framework/sessions/.gitkeep
          touch deploy-staging/storage/framework/views/.gitkeep
          touch deploy-staging/storage/framework/cache/data/.gitkeep

          echo "📦 Deploy package ready: $(find deploy-staging -type f | wc -l) files"

      - name: Deploy Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          local-dir: ./deploy-staging/
          dangerous-clean-slate: false

      - name: Verify Deployment
        run: |
          echo "🔍 Verifying deployment..."

          ENDPOINTS=(
            "https://upz.unsil.ac.id/upz-api/public/api"
            "https://upz.unsil.ac.id/upz-api/public/"
            "http://upz.unsil.ac.id/upz-api/public/"
          )

          SUCCESS=false
          for URL in "${ENDPOINTS[@]}"; do
            echo "Checking: $URL"
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -k "$URL" 2>&1 || true)
            echo "  Status: $HTTP_STATUS"
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 500 ]; then
              SUCCESS=true
              echo "  ✅ Server is responding!"
              break
            fi
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "⚠️ Could not verify deployment, but files were uploaded successfully."
            echo "Please check the site manually."
          fi
          echo "✅ Backend deployment complete!"
