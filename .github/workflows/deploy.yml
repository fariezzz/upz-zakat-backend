name: Deploy Backend to cPanel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy Laravel
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, mysqli, pdo_pgsql, pgsql, bcmath, curl, zip, tokenizer, fileinfo
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: |
          composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction --no-progress

      - name: Prepare Archive Package & Extractor
        run: |
          TOKEN=$(openssl rand -hex 16)
          echo "DEPLOY_TOKEN=${TOKEN}" >> $GITHUB_ENV

          mkdir -p deploy-pkg/public


          tar -czf deploy-pkg/release.tar.gz \
            --exclude='.git*' \
            --exclude='.env*' \
            --exclude='tests' \
            --exclude='node_modules' \
            --exclude='.dockerignore' \
            --exclude='Dockerfile' \
            --exclude='docker' \
            --exclude='render.yaml' \
            --exclude='phpunit.xml' \
            --exclude='README.md' \
            --exclude='deploy-pkg' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/framework/cache/data/*' \
            .

          cat << 'EOF' > deploy-pkg/unzip.php
          <?php
          @ini_set('display_errors', '1');
          @error_reporting(E_ALL);

          $token = $_GET['token'] ?? '';
          $expectedToken = '__TOKEN_PLACEHOLDER__';

          if (empty($token) || !hash_equals($expectedToken, $token)) {
              http_response_code(403);
              header('Content-Type: application/json');
              echo json_encode(['status' => 'error', 'message' => 'Forbidden: Invalid token']);
              exit;
          }

          $extractPath = __DIR__;
          $tarFile = __DIR__ . '/release.tar.gz';

          if (!file_exists($tarFile)) {
              $tarFile = dirname(__DIR__) . '/release.tar.gz';
              $extractPath = dirname(__DIR__);
          }

          if (!file_exists($tarFile)) {
              http_response_code(404);
              header('Content-Type: application/json');
              echo json_encode(['status' => 'error', 'message' => 'release.tar.gz not found in ' . $extractPath]);
              exit;
          }

          @set_time_limit(300);
          @ini_set('memory_limit', '512M');

          $extracted = false;

          if (class_exists('PharData')) {
              try {
                  $phar = new PharData($tarFile);
                  $phar->extractTo($extractPath, null, true);
                  $extracted = true;
                  @unlink($tarFile);
              } catch (\Throwable $e) {
                  $extracted = false;
              }
          }

          if ($extracted) {
              @unlink(__FILE__);
              @unlink($extractPath . '/unzip.php');
              @unlink($extractPath . '/public/unzip.php');

              header('Content-Type: application/json');
              echo json_encode(['status' => 'success', 'message' => 'Backend extracted & deployed successfully!']);
              exit;
          }

          http_response_code(500);
          header('Content-Type: application/json');
          echo json_encode(['status' => 'error', 'message' => 'Failed to extract package. Please check PHP permissions.']);
          EOF

          sed -i 's/^[ \t]*//' deploy-pkg/unzip.php
          sed -i "s/__TOKEN_PLACEHOLDER__/${TOKEN}/g" deploy-pkg/unzip.php
          cp deploy-pkg/unzip.php deploy-pkg/public/unzip.php

          # Set strict cPanel permissions (755 for directories, 644 for files)
          chmod 755 deploy-pkg deploy-pkg/public
          chmod 644 deploy-pkg/release.tar.gz deploy-pkg/unzip.php deploy-pkg/public/unzip.php

          echo "📦 Package size: $(du -sh deploy-pkg/release.tar.gz | cut -f1)"

      - name: Upload Package via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          local-dir: ./deploy-pkg/

      - name: Trigger Remote Auto-Extraction
        run: |
          echo "🚀 Triggering remote unzip on server..."

          SERVER_INPUT="${{ secrets.FTP_SERVER }}"
          SERVER_IP=$(getent ahosts "$SERVER_INPUT" 2>/dev/null | awk '{print $1}' | head -n 1)
          if [ -z "$SERVER_IP" ]; then
            SERVER_IP="$SERVER_INPUT"
          fi

          RESOLVE_ARGS=""
          if [ -n "$SERVER_IP" ]; then
            RESOLVE_ARGS="--resolve upz.unsil.ac.id:443:$SERVER_IP --resolve upz.unsil.ac.id:80:$SERVER_IP"
          fi

          ENDPOINTS=(
            "https://upz.unsil.ac.id/upz-api/unzip.php?token=${{ env.DEPLOY_TOKEN }}"
            "https://upz.unsil.ac.id/upz-api/public/unzip.php?token=${{ env.DEPLOY_TOKEN }}"
            "http://upz.unsil.ac.id/upz-api/unzip.php?token=${{ env.DEPLOY_TOKEN }}"
            "http://upz.unsil.ac.id/upz-api/public/unzip.php?token=${{ env.DEPLOY_TOKEN }}"
          )

          SUCCESS=false
          for URL in "${ENDPOINTS[@]}"; do
            echo "Trying trigger URL: $URL"
            RESPONSE=$(curl -s -k $RESOLVE_ARGS -w "\nHTTP_STATUS:%{http_code}" "$URL" 2>&1 || true)
            HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2 | tr -d ' \r\n')
            BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Server Response: $BODY"
              SUCCESS=true
              break
            else
              echo "Status $HTTP_STATUS: $BODY"
            fi
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "❌ Extraction failed! Could not trigger unzip.php on any endpoint."
            exit 1
          fi
          echo "✅ Backend successfully deployed and extracted in seconds!"
